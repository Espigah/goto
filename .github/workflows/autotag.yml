name: Auto-tag release

# Gated full release. After the CI workflow finishes on main, if (and only if)
# it PASSED and the version in main.go is new, push a v<version> tag, which
# fans out to release.yml (deb/rpm/tar.gz + AppImage), snap.yml, windows.yml
# and the pages repo rebuild. Same version, or CI failed -> no-op.
#
# The tag is pushed with a PAT (secret RELEASE_PAT) on purpose: a tag pushed
# with the default GITHUB_TOKEN would NOT trigger the other workflows.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  autotag:
    # only proceed when the CI run that triggered us actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # head_sha is a commit SHA (safe to use as ref): the exact commit CI passed on.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Tag the release when the version changed
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          ver="$(grep -oP 'version = "\K[0-9][^"]*' main.go)"
          [ -n "$ver" ] || { echo "could not read version from main.go"; exit 1; }
          tag="v$ver"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag"; then
            echo "tag $tag already exists; nothing to release."
            exit 0
          fi
          if [ -z "$RELEASE_PAT" ]; then
            echo "::warning::version $ver is new but RELEASE_PAT is not set; cannot push the release tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$tag"
          echo ">> pushed $tag -> release / snap / windows / pages will run"
