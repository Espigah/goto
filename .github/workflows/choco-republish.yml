name: Chocolatey Republish

# Manually (re)push a specific already-released version of the goto-window
# Chocolatey package. Useful to update the nuspec of a version that is pending
# moderation, re-pushing the SAME pending version is allowed by the community
# repo ("repush the exact same version" to address review). Does NOT rebuild,
# it reuses the published release .exe and just repacks with the current nuspec.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)push, e.g. 0.3.17 (no leading v)"
        required: true

permissions:
  contents: read

jobs:
  republish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack and push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ver = "$env:INPUT_VERSION".Trim().TrimStart('v')
          if ($ver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid version '$ver' (expected like 0.3.17)"; exit 1
          }
          if ([string]::IsNullOrEmpty($env:CHOCO_API_KEY)) {
            Write-Error "CHOCO_API_KEY secret is not set"; exit 1
          }
          $url = "https://github.com/Espigah/goto/releases/download/v$ver/goto_${ver}_windows_amd64.exe"
          $tmp = "$env:RUNNER_TEMP\goto_$ver.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile $tmp
          $sha = (Get-FileHash -Algorithm SHA256 $tmp).Hash.ToLower()
          $choco = "packaging/chocolatey"
          $script = "$choco/tools/chocolateyinstall.ps1"
          (Get-Content $script -Raw).Replace('{{VERSION}}', $ver).Replace('{{SHA256}}', $sha) | Set-Content $script
          choco pack "$choco/goto-window.nuspec" --version $ver --outputdirectory $choco
          choco push "$choco/goto-window.$ver.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
