name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Build on the OLDEST supported runner so the binary links against an older
    # glibc and runs on more systems. ubuntu-22.04 ships glibc 2.35, which covers
    # Ubuntu 22.04 LTS+, Debian 12+, etc. ubuntu-latest (24.04) needs glibc 2.39
    # and fails on anything older with "GLIBC_2.38 not found".
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: "1"
      # ABSOLUTE: CGO compiles in the package dir, so a relative path
      # cannot find whisper.h / libwhisper.a.
      C_INCLUDE_PATH: ${{ github.workspace }}/third_party/whisper.cpp/include:${{ github.workspace }}/third_party/whisper.cpp/ggml/include
      LIBRARY_PATH: ${{ github.workspace }}/third_party/whisper.cpp/build_go/src:${{ github.workspace }}/third_party/whisper.cpp/build_go/ggml/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build deps (cmake/g++/ninja)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
          # the vendored whisper Makefile calls `cmake --build` with no -j;
          # Ninja parallelizes on its own, so the lib build uses all cores.
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - name: GoReleaser (build + deb/rpm/tar.gz + release)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # AppImage is built after GoReleaser (it is not a goreleaser format) from
      # the same binary in dist/, then attached to the release.
      - name: Build AppImage
        run: bash scripts/build-appimage.sh "${{ github.ref_name }}"

      - name: Attach AppImage to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" goto_*_x86_64.AppImage --clobber
